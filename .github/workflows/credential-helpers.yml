name: credential-helpers

on:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            rust: aarch64-apple-darwin
          - target: darwin-x64
            runner: macos-15-intel
            rust: x86_64-apple-darwin
          - target: win32-x64
            runner: windows-2025
            rust: x86_64-pc-windows-msvc
          - target: win32-arm64
            runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - run: cargo test --manifest-path native/credential-helper/Cargo.toml --target ${{ matrix.rust }}
      - run: cargo build --release --manifest-path native/credential-helper/Cargo.toml --target ${{ matrix.rust }}

  assemble:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/verify-credential-helpers.mjs
