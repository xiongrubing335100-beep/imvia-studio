name: credential-helpers

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            rust: aarch64-apple-darwin
            binary: imvia-credential-helper
          - target: darwin-x64
            runner: macos-15-intel
            rust: x86_64-apple-darwin
            binary: imvia-credential-helper
          - target: win32-x64
            runner: windows-2025
            rust: x86_64-pc-windows-msvc
            binary: imvia-credential-helper.exe
          - target: win32-arm64
            runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
            binary: imvia-credential-helper.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      # Keep the checked-out source reproducibly formatted before compiling.
      # The local developer shell does not need to install Rust just to run
      # this release workflow; rustfmt is supplied by the pinned toolchain.
      - run: cargo fmt --manifest-path native/credential-helper/Cargo.toml --all
      - run: cargo generate-lockfile --manifest-path native/credential-helper/Cargo.toml
      - run: cargo test --manifest-path native/credential-helper/Cargo.toml --target ${{ matrix.rust }}
      - run: cargo build --release --manifest-path native/credential-helper/Cargo.toml --target ${{ matrix.rust }}

      - name: Stage helper
        shell: bash
        run: |
          set -euo pipefail
          source_path="native/credential-helper/target/${{ matrix.rust }}/release/${{ matrix.binary }}"
          destination="artifact/${{ matrix.target }}/${{ matrix.binary }}"
          test -f "$source_path"
          mkdir -p "$(dirname "$destination")"
          cp "$source_path" "$destination"

      # Release tags must use signing identities installed on the protected
      # runner. Pull requests still compile and test, but never produce a
      # distributable artifact.
      - name: Sign macOS helper
        if: startsWith(github.ref, 'refs/tags/v') && startsWith(matrix.target, 'darwin-')
        shell: bash
        env:
          IMVIA_MACOS_SIGNING_IDENTITY: ${{ secrets.IMVIA_MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$IMVIA_MACOS_SIGNING_IDENTITY"
          helper="artifact/${{ matrix.target }}/${{ matrix.binary }}"
          codesign --force --options runtime --timestamp --sign "$IMVIA_MACOS_SIGNING_IDENTITY" "$helper"
          codesign --verify --strict --verbose=2 "$helper"

      - name: Notarize macOS helper
        if: startsWith(github.ref, 'refs/tags/v') && startsWith(matrix.target, 'darwin-')
        shell: bash
        env:
          IMVIA_MACOS_NOTARY_PROFILE: ${{ secrets.IMVIA_MACOS_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          test -n "$IMVIA_MACOS_NOTARY_PROFILE"
          helper="artifact/${{ matrix.target }}/${{ matrix.binary }}"
          archive="$RUNNER_TEMP/${{ matrix.target }}.zip"
          ditto -c -k --keepParent "$helper" "$archive"
          xcrun notarytool submit "$archive" --keychain-profile "$IMVIA_MACOS_NOTARY_PROFILE" --wait

      - name: Sign Windows helper
        if: startsWith(github.ref, 'refs/tags/v') && startsWith(matrix.target, 'win32-')
        shell: pwsh
        env:
          IMVIA_WINDOWS_SIGNING_SUBJECT: ${{ secrets.IMVIA_WINDOWS_SIGNING_SUBJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IMVIA_WINDOWS_SIGNING_SUBJECT)) { throw "IMVIA_WINDOWS_SIGNING_SUBJECT is required for release tags" }
          $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $helper = "artifact/${{ matrix.target }}/${{ matrix.binary }}"
          & $signTool sign /fd SHA256 /a /n $env:IMVIA_WINDOWS_SIGNING_SUBJECT $helper
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
          & $signTool verify /pa $helper
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }

      - name: Record signed artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            darwin-*) signer="apple-codesign+notarytool" ;;
            win32-*) signer="authenticode" ;;
            *) exit 64 ;;
          esac
          printf '{"signed":true,"target":"%s","signer":"%s"}\n' "${{ matrix.target }}" "$signer" > "artifact/${{ matrix.target }}/signature.json"

      - name: Upload signed helper
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: credential-helper-${{ matrix.target }}
          path: artifact/${{ matrix.target }}
          if-no-files-found: error

  assemble:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: credential-helper-darwin-arm64
          path: artifacts/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: credential-helper-darwin-x64
          path: artifacts/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: credential-helper-win32-arm64
          path: artifacts/win32-arm64
      - uses: actions/download-artifact@v4
        with:
          name: credential-helper-win32-x64
          path: artifacts/win32-x64
      - name: Assemble and verify manifest
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/assemble-credential-helpers.mjs" \
            --output "$GITHUB_WORKSPACE/assembled" \
            --darwin-arm64 "$GITHUB_WORKSPACE/artifacts/darwin-arm64" \
            --darwin-x64 "$GITHUB_WORKSPACE/artifacts/darwin-x64" \
            --win32-arm64 "$GITHUB_WORKSPACE/artifacts/win32-arm64" \
            --win32-x64 "$GITHUB_WORKSPACE/artifacts/win32-x64"
          (cd assembled && node "$GITHUB_WORKSPACE/scripts/verify-credential-helpers.mjs")
      - uses: actions/upload-artifact@v4
        with:
          name: imvia-studio-credential-helpers-${{ github.ref_name }}
          path: assembled/native
          if-no-files-found: error
